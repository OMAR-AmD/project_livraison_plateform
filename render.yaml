# Render Blueprint: the whole stack, free tier, one click.
#
#   New > Blueprint > point at this repo > Apply.
#
# Nothing here is invented for the platform's benefit -- every value is the same
# one docker-compose.yml already passes locally, moved from an ARG to an
# environment variable because that is how a PaaS accepts configuration.
#
# WHAT THIS COSTS, STATED PLAINLY
#   Every service is on the `free` plan. That buys three limitations, none of
#   which are defects and all of which are worth saying out loud in a report:
#     - free web services sleep after ~15 min idle and take ~1 min to wake. The
#       first request during a demo pays that. Touch both URLs ~60s beforehand.
#     - free Postgres is DELETED 30 days after creation (14-day grace, then gone).
#       Fine for a demo, fatal as a production plan. Nothing in the code can
#       defend against that; only money can.
#     - free Key Value is in-memory and 25 MB. Losing it on restart costs
#       nothing here: fraud trails carry a 6-hour TTL and are rebuilt by the next
#       position update.
#
# WHAT CHANGES VS LOCAL, AND WHY
#   OSRM. Locally it is a container built from a map extract, ~1.5 GB, which no
#   free tier can hold. Rather than ship a platform whose auto-dispatch silently
#   assigns nobody -- orders stuck PENDING until an admin intervenes by hand --
#   this points at OSRM's official public demo server. Verified answering `Ok`
#   before it was written down here. It is someone else's machine and it is
#   rate-limited; that is an acceptable trade for a demo and would not be for
#   production.
#
# THE ONE FIELD THAT MAY NEED FIXING AFTER A FRESH APPLY
#   BACKEND_URL below is the real host for the current deployment. Render names
#   the public subdomain after the service, but `swiftdeliver-backend` was already
#   taken, so the backend was assigned the suffix `-j47m`. A future blueprint
#   apply will very likely get a different suffix, and this value would be wrong
#   again: the frontend's Next.js rewrites are inlined at BUILD time
#   (next.config.mjs) while the backend's URL is not known until the backend
#   exists.
#   Symptom if it is wrong: the site loads, login renders, every API call 502s.
#   Fix: Dashboard > swiftdeliver-frontend > Environment > set BACKEND_URL to the
#   backend's real URL > Save & Deploy. No rebuild of anything else is needed,
#   and the frontend does not have to be redeployed twice to find out.

# ON REGION
#   `region` is a per-resource field, not a root-level one. It is also immutable
#   after creation, so it is repeated on every resource rather than set once in a
#   DRY block that does not exist. frankfurt is deliberate: lowest latency for a
#   European audience, and the public OSRM demo server this stack routes through
#   is also in Europe.

services:
  # ---------------------------------------------------------------- cache
  # Redis-compatible. Carries live courier positions, dispatch state and the
  # fraud trails behind the fraud panel.
  - type: keyvalue
    name: swiftdeliver-cache
    plan: free
    # Same region as the backend, and this is not cosmetic. A Key Value
    # instance's internal URL is only reachable from services in its own
    # region, and `region` defaults to oregon. Omitted -- as it was -- the
    # backend in frankfurt cannot reach the cache at all: login still works,
    # but every delivery list containing an IN_TRANSIT order 500s on the
    # live-position read, and the fraud panel holds no trails. Found against
    # the deployed instance, not in review.
    region: frankfurt
    # Required for every Key Value instance. 0.0.0.0/0 because the backend
    # reaches it over Render's private network, and the instance has no password
    # -- access control here is the allowlist, so this is worth a sentence in a
    # security section rather than passing over in silence.
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere
    # The trails are TTL'd, so evicting the oldest key under memory pressure is
    # the right thing to lose -- unlike the default allkeys-lru, which is
    # indistinguishable here anyway.
    maxmemoryPolicy: volatile-ttl
    # Quoted, and this is not tidiness. Under YAML 1.1 an unquoted `off` is the
    # boolean false, so Render would receive `false` where it expects one of
    # three enum strings. Render's schema is what caught it; eyeballing the file
    # did not, because `persistenceMode: off` looks exactly right.
    persistenceMode: "off"

  # ---------------------------------------------------------------- backend
  - type: web
    name: swiftdeliver-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: frankfurt
    # Deploy only when the branch is green, rather than on every commit. This is
    # the actual mechanism behind the CI/CD claim: GitHub Actions is the gate.
    # If pushes ever stop producing deploys, Render's GitHub app cannot see the
    # check runs -- switch this to `commit` in the dashboard and the chain works
    # again with the gate removed.
    autoDeployTrigger: checksPass
    # Must answer 2xx or Render treats the service as dead and never routes to
    # it. Every pre-existing path answers 403/404/405 to an unauthenticated GET,
    # which is why GET /api/v1/health was added rather than reusing /auth/login.
    healthCheckPath: /api/v1/health
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: swiftdeliver-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: swiftdeliver-db
          property: port
      # `database`, not `databaseName`. Render's schema enumerates the available
      # properties as connectionString | connectionPoolString | host | port |
      # user | password | database, and the field is additionalProperties:false,
      # so `databaseName` is rejected outright rather than ignored.
      - key: DB_NAME
        fromDatabase:
          name: swiftdeliver-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: swiftdeliver-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: swiftdeliver-db
          property: password
      - key: REDIS_HOST
        fromService:
          name: swiftdeliver-cache
          type: keyvalue
          property: host
      - key: REDIS_PORT
        fromService:
          name: swiftdeliver-cache
          type: keyvalue
          property: port
      # Base64 256-bit, i.e. 44 characters, comfortably over the 32-byte minimum
      # JwtService enforces at startup. Generated by Render, never committed,
      # never reused. The service refuses to boot without it and names this
      # variable in the failure.
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: OSRM_BASE_URL
        value: https://router.project-osrm.org
      # Seeds the demo accounts (admin@swift.com / password123 and friends) so
      # the deployed instance is demoable the moment it finishes booting. On a
      # database that already has data this is a no-op.
      - key: SPRING_PROFILES_ACTIVE
        value: demo

  # ---------------------------------------------------------------- frontend
  - type: web
    name: swiftdeliver-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    region: frankfurt
    autoDeployTrigger: checksPass
    # /login is server-rendered, so 200 here means Next itself is serving. It
    # deliberately does not touch the backend: a health check that depends on the
    # backend would mark the frontend down whenever the backend is asleep or
    # rebuilding, and pull it out of rotation for something it is not at fault
    # for.
    healthCheckPath: /login
    envVars:
      # Build-time. Next inlines rewrites into the server bundle, so this has to
      # be an ARG by the time the image builds -- Render translates environment
      # variables into build arguments for Docker services automatically. See the
      # "one field you may have to fix" note at the top of this file.
      - key: BACKEND_URL
        value: https://swiftdeliver-backend-j47m.onrender.com
      - key: OSRM_URL
        value: https://router.project-osrm.org

databases:
  - name: swiftdeliver-db
    plan: free
    region: frankfurt
    # Pinned to 15 to match the pgvector/pgvector:pg15 image used locally.
    # Immutable after creation, like region. Leaving it out would silently give
    # PG 18 and make "works on my machine" mean two different database engines.
    postgresMajorVersion: '15'