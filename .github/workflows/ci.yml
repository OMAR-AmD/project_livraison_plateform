name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    # The context-load test boots the whole application, which needs a database
    # and Redis. It does NOT need a language model: the assistant degrades when
    # Ollama is absent, so the AI module cannot break the build. The routing
    # test skips itself when OSRM is not reachable.
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password123
          POSTGRES_DB: delivery_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        # The Maven project lives in backend/. Without this, ./mvnw is resolved
        # against the repository root, where it does not exist, and the build
        # fails instantly with "No such file or directory" instead of building.
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
          cache-dependency-path: backend/pom.xml

      # application.yml has no default signing key on purpose, so it must be
      # supplied for the context-load test to boot.
      - name: Provide a signing key for the build
        run: echo "JWT_SECRET_KEY=$(openssl rand -hex 32)" >> $GITHUB_ENV

      # Fails loudly if the wrapper is missing or unparseable. That distinction
      # was the difference between a real build and an instant, unexplained
      # failure, so it is checked before anything depends on it.
      - name: Check the Maven wrapper is usable
        run: |
          set -euo pipefail
          f=.mvn/wrapper/maven-wrapper.properties
          test -f mvnw || { echo "mvnw is missing from the checkout"; exit 1; }
          test -f "$f" || { echo "$f is missing"; exit 1; }
          # A committed-as-UTF-16 properties file still exists here, because git
          # treats any file containing NUL as binary and leaves its bytes alone
          # regardless of the text=auto rule. The wrapper then cannot parse it
          # and the build dies instantly. Compare byte counts rather than using
          # grep, which does not reliably match a NUL byte.
          total=$(wc -c < "$f")
          without_nul=$(tr -d '\000' < "$f" | wc -c)
          if [ "$total" -ne "$without_nul" ]; then
            echo "$f contains NUL bytes ($total bytes, $without_nul without NUL):"
            echo "it was committed as UTF-16, which the wrapper script cannot read."
            exit 1
          fi
          echo "wrapper properties: $(cat "$f")"

      # docker-compose.yml mounts init.sql into the database container, which
      # is how a local run gets pgvector. A service container has no such mount,
      # so without this step the extension is absent and the AI subsystem is
      # skipped rather than tested. Enable it so the real configuration is
      # exercised, and so a regression in the vector store fails the build
      # instead of passing quietly.
      - name: Enable the pgvector extension
        run: |
          set -euo pipefail
          ready=""
          for i in $(seq 1 30); do
            if docker run --rm --network host -e PGPASSWORD=password123 \
                pgvector/pgvector:pg15 \
                psql -h 127.0.0.1 -U admin -d delivery_db -tAc "SELECT 1" >/dev/null 2>&1; then
              ready=yes
              break
            fi
            echo "waiting for postgres (attempt $i/30)"
            sleep 2
          done
          test -n "$ready" || { echo "postgres never became reachable"; exit 1; }
          docker run --rm --network host -e PGPASSWORD=password123 \
            pgvector/pgvector:pg15 \
            psql -h 127.0.0.1 -U admin -d delivery_db -v ON_ERROR_STOP=1 \
            -c "CREATE EXTENSION IF NOT EXISTS vector;" \
            -c "SELECT extname, extversion FROM pg_extension WHERE extname='vector';"

      - name: Package (compiles and runs the tests)
        run: ./mvnw -B package

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar
          if-no-files-found: ignore

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
