server:
  # PORT, not a literal. Render (and every other PaaS) assigns the listening
  # port through the environment and expects the process to bind it; a hardcoded
  # 8080 means the platform starts, passes its own health check locally, and is
  # then unreachable behind the platform's proxy because it is not listening
  # where the proxy is knocking. The default keeps a bare `mvn spring-boot:run`
  # on 8080 with nothing exported.
  port: ${PORT:8080}

spring:
  datasource:
    # The host is overridable because it has to be. Hardcoded, it is `localhost`
    # -- which inside a container is the container itself, and the backend spends
    # its startup retrying a Postgres that is running two services away and is
    # perfectly healthy. The compose stack sets DB_HOST=postgres; a local run
    # needs nothing, because the default is still localhost.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:delivery_db}
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:password123}
    driver-class-name: org.postgresql.Driver

  # Redis holds the live courier positions and the fraud trails. This block did
  # not exist at all, which is how the host stayed stuck at Spring's own default
  # of localhost: the app never mentioned a Redis address, so there was nothing
  # to override. The failure mode was the quiet kind -- the platform runs, the
  # fraud panel is empty rather than broken, and auto-dispatch throws
  # RedisConnectionFailureException for every paid order, so orders sit PENDING
  # until an admin assigns them. Same rule as the datasource: the host is a
  # variable, and the default is still localhost for a local run.
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  ai:
    ollama:
      # Ollama is an external process, not a container. The default is correct
      # for a local run (mvn spring-boot:run); docker-compose overrides it with
      # host.docker.internal, because inside a container `localhost` is the
      # container itself -- which silently disables the assistant even when
      # Ollama is running and the models are pulled.
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        model: llama3.2:1b
        options:
          temperature: 0.2
      embedding:
        model: nomic-embed-text
    vectorstore:
      pgvector:
        # Deliberately false. With this on, Spring AI creates the vector table
        # while the context is starting, and if the pgvector extension is
        # missing the whole application fails to boot - a delivery platform
        # taken down by an optional AI dependency. ChatService creates the
        # table itself inside its startup routine, which already treats failure
        # as "the assistant is unavailable" and lets the platform still run.
        initialize-schema: false
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 768

application:
  osrm:
    # Self-hosted routing engine (see docker-compose.yml). Used for pricing quotes
    # and for the auto-dispatcher's travel-time matrix.
    base-url: ${OSRM_BASE_URL:http://localhost:5000}
  security:
    jwt:
      # Must be supplied in any real deployment. There is deliberately no
      # fallback value here: shipping a well-known signing key would let anyone
      # who has read this repository mint a valid token for any user, including
      # administrators. Use at least 32 random bytes.
      #
      # For local development:  export JWT_SECRET_KEY=$(openssl rand -hex 32)
      secret-key: ${JWT_SECRET_KEY}
      expiration: ${JWT_EXPIRATION:86400000}
    # Failed-sign-in limiter. Both counters are windows, in seconds, and both
    # reset on a successful sign-in (per account) or when the window passes.
    # The per-client limit is much looser than the per-account one because a
    # shared address makes innocent users share it. Overridable so the limit can
    # be tightened for a demo without editing code.
    login-rate-limit:
      max-per-account: ${LOGIN_MAX_PER_ACCOUNT:5}
      max-per-client: ${LOGIN_MAX_PER_CLIENT:50}
      window-seconds: ${LOGIN_WINDOW_SECONDS:900}
  proof:
    # Root secret for the delivery-proof MAC (see DeliveryProofService). The key
    # actually used to seal is derived from this value rather than being equal to
    # it: the class computes a purpose-bound key from it, so the seal and JWT
    # signatures never share key material even when both trace back to one root
    # secret.
    #
    # Defaults to the JWT secret so a single secret configures the whole
    # platform. Set PROOF_HMAC_KEY to rotate the two independently. There is no
    # literal fallback on purpose: a well-known default would make every proof in
    # the system forgeable, and nothing would look wrong.
    hmac-key: ${PROOF_HMAC_KEY:${JWT_SECRET_KEY}}