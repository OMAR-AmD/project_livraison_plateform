version: '3.8'

services:
  # ----------------------------------------
  # PostgreSQL Database (Relational Data)
  # ----------------------------------------
  postgres:
    image: pgvector/pgvector:pg15
    container_name: delivery_postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: delivery_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  # ----------------------------------------
  # Redis (Cache & Real-time WebSockets)
  # ----------------------------------------
  redis:
    image: redis:7
    container_name: delivery_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  # ----------------------------------------
  # OSRM (Routing Engine)
  # ----------------------------------------
  osrm:
    image: osrm/osrm-backend
    container_name: delivery_osrm
    restart: always
    ports:
      - "5000:5000"
    volumes:
      - ./osrm-data:/data
    command: osrm-routed --algorithm mld /data/map.osrm

# ----------------------------------------
# Persistent Storage Volumes
# ----------------------------------------
volumes:
  pgdata:
  redisdata:
  osrmdata: